
services:
  product-service:
    image: greatcoderhyd/shopping-product:latest
    networks:
      - shopping-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  shopping-app:
    image: greatcoderhyd/shopping-app:latest
    ports:
      - "8081:8080"
    environment:
      PRODUCT_API_URL: http://product-service:8080/api/product
    networks:
      - shopping-network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  shopping-network:
    driver: overlay

