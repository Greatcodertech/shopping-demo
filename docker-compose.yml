services:
  product-service:
    image: greatcoderhyd/shopping-product:latest
    networks:
      - shopping-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  shopping-app:
    image: greatcoderhyd/shopping-app:latest
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    environment:
      PRODUCT_API_URL: http://product-service:8080/api/product
    networks:
      - shopping-network
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

networks:
  shopping-network:
    driver: overlay
